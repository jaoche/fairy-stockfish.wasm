name: build-fs-wasm-c
on:
  workflow_dispatch:
  push:
    branches: [build-emsdk31]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build
        run: |
          cd src/emscripten
          DOCKER_USER=$(id -u):$(id -g) docker compose run emscripten \
            make -C .. emscripten_build ARCH=wasm wasm_simd=yes embedded_nnue=yes || true
          echo "=== 产物清单 ==="
          ls -l .. | head -30
          ls -l public 2>/dev/null | head -10
      - name: Report worker file (optional on emsdk>=3)
        run: |
          ls -l src/emscripten/public || true
          if [ -f src/emscripten/public/stockfish.worker.js ]; then
            grep -c onCustomMessage src/emscripten/public/stockfish.worker.js || true
          else
            echo "no standalone worker (emsdk>=3 inlines pthread worker)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fs-wasm-c
          path: src/emscripten/public/stockfish*
