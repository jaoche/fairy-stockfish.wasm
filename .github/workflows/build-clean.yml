name: build-clean
on:/n  workflow_dispatch:/n  push:/n    branches: [build-clean-v112]
jobs:/n  build:/n    runs-on: ubuntu-24.04
    steps:/n      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Build (official flags)
        run: |
          cd src/emscripten
          DOCKER_USER=$(id -u):$(id -g) docker compose run emscripten \
            make -C .. emscripten_build ARCH=wasm wasm_simd=yes embedded_nnue=yes
      - name: Sanity worker has postamble
        run: grep -c onCustomMessage src/emscripten/public/stockfish.worker.js
      - uses: actions/upload-artifact@v4
        with:/n          name: fs-clean
          path: |
            src/emscripten/public/stockfish.js
            src/emscripten/public/stockfish.wasm
            src/emscripten/public/stockfish.worker.js
